name: Sample checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PAIFLOW_API_TOKEN: campus-snacks-build-canary
          PAIFLOW_DEPLOYMENT_ID: 11111111-1111-4111-8111-111111111111
      - run: pnpm check:bundles
      - run: pnpm audit
